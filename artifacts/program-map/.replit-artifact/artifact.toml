kind = "web"
previewPath = "/"
title = "Program Map Dashboard"
version = "1.0.0"
id = "artifacts/program-map"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25962

[services.development]
run = "pnpm --filter @workspace/program-map run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/program-map", "run", "build" ]
publicDir = "artifacts/program-map/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25962"
BASE_PATH = "/"
