name: Typecheck

on:
  push:
  pull_request:

jobs:
  typecheck:
    name: Typecheck lib packages and artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build lib packages
        run: pnpm run typecheck:libs

      - name: Check lib package dists are up to date
        run: pnpm run typecheck:libs:check

      - name: Typecheck artifacts
        run: pnpm -r --filter "./artifacts/**" --filter "./scripts" --if-present run typecheck
