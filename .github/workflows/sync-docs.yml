name: Sync Docs to GitHub

on:
  push:
    branches:
      - main
    paths:
      - "TRAIL_OS_SPEC.md"
      - "ROADMAP.md"
      - "CHANGELOG.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".env.example"
  pull_request:
    branches:
      - main
    paths:
      - "TRAIL_OS_SPEC.md"
      - "ROADMAP.md"
      - "CHANGELOG.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".env.example"

jobs:
  validate-and-tag:
    name: Validate docs and mark sync point
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required docs exist and are non-empty
        run: |
          MISSING=()
          for doc in TRAIL_OS_SPEC.md ROADMAP.md CHANGELOG.md README.md CONTRIBUTING.md SECURITY.md; do
            if [ ! -s "$doc" ]; then
              MISSING+=("$doc")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "ERROR: The following required docs are missing or empty:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "All required docs present and non-empty."

      - name: Summarise changed docs
        run: |
          echo "## Docs changed in this push" >> $GITHUB_STEP_SUMMARY
          git diff --name-only HEAD~1 HEAD -- "*.md" ".env.example" | while read f; do
            SIZE=$(wc -l < "$f" 2>/dev/null || echo "?")
            echo "- \`$f\` (${SIZE} lines)" >> $GITHUB_STEP_SUMMARY
          done

      - name: Auto-append changelog entry for major doc changes
        if: github.event_name == 'push'
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- TRAIL_OS_SPEC.md ROADMAP.md)
          if [ -z "$CHANGED" ]; then
            echo "No changes to TRAIL_OS_SPEC.md or ROADMAP.md — skipping changelog update."
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          SHORT_SHA="${GITHUB_SHA:0:7}"
          FILES=$(echo "$CHANGED" | paste -sd ', ')

          ENTRY="### Docs — ${DATE} (${SHORT_SHA})\n\n- Auto-logged: \`${FILES}\` updated in commit \`${SHORT_SHA}\`"

          awk -v entry="$ENTRY" '
            /^## \[Unreleased\]/ {
              print
              print ""
              print entry
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Changelog already up to date — nothing to commit."
            exit 0
          fi
          git commit -m "chore(docs): auto-changelog ${SHORT_SHA}"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest-docs tag to this commit
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Pull any commit added by the auto-changelog step before tagging
          git pull --ff-only origin main || true
          git tag -f latest-docs
          git push origin latest-docs --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
